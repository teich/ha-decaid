name: Integration validation
on:
  push:
  pull_request:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # No license selected yet; required for default catalog submission.
          ignore: license
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
