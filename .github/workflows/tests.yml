name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.14'
            harness: '0.13.371' # Home Assistant 2026.10.0
          - python: '3.14'
            harness: '0.13.375' # Home Assistant 2026.10.4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest-homeassistant-custom-component==${{ matrix.harness }}
      - run: pytest -q
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install ruff==0.16.6
      - run: ruff check .
      - run: ruff format --check .
