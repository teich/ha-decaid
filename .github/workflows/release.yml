name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the manifest version
        run: |
          version=$(jq -r .version custom_components/decaid/manifest.json)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
      - name: Package the integration
        run: cd custom_components/decaid && zip -r "$GITHUB_WORKSPACE/decaid.zip" . -x '__pycache__/*'
      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" decaid.zip --clobber
